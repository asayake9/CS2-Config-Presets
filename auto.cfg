//─────────────────────────    5.1样式设置    ────────────────────────────
// 准星参数放在crosshair.cfg中 | 注意同样替换后面的投掷物准星中的`exec crosshair.cfg`
// 准星参数放在↓  默认准星（2026 新版代码格式）
// 分享代码：CSazpFcqRjJEGN4iG36KH97nwXH65cOW8ZVEGh5Cq2niyE
// 下面是把该代码展开后的真实参数，想微调就改数值；不想改就当参照
cl_crosshairstyle                        4
cl_crosshair_length                      8
cl_crosshair_thickness                   3
cl_crosshair_gap                         6
cl_crosshair_t                           0
cl_crosshairdot                          0
cl_crosshair_sniper_width                1
cl_crosshairalpha                        250
cl_crosshaircolor_r                      0
cl_crosshaircolor_g                      255
cl_crosshaircolor_b                      0
cl_crosshaircolor_a                      255
cl_crosshair_drawoutline                 1
cl_crosshairoutline_r                    0
cl_crosshairoutline_g                    0
cl_crosshairoutline_b                    0
cl_crosshairoutline_a                    141
cl_crosshair_dynamic_maxdist_splitratio  0.35
cl_crosshair_dynamic_splitalpha_innermod 1
cl_crosshair_dynamic_splitalpha_outermod 0.5
cl_crosshair_dynamic_splitdist           7
