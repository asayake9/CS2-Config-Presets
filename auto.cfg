// ──────────────────  目录  ────────────────────
// 0. 网络/帧数据
// 1. 鼠标设置
// 2. 准星&持枪设置
// 3. 视频设置
// 4. 键位绑定
// 5. 快速买枪
// 6. 基础设置
// 7. 声音设置
// 8. HUD设置

//══════════════════════    1. 视频设置    ════════════════════════════════════
//────────────────────     1.1视频    ────────────────────
r_fullscreen_gamma              2.2 // 亮度 越小越亮（全屏生效） 默认2.2

//────────────────────     1.2高级视频选项    ────────────────────
r_player_visibility_mode        1   // 增强角色对比度 <0.基础 1.增强，默认 1>

fps_max                       170   // 最大帧数
fps_max_ui                    165   // UI最大帧数（主界面）
fps_max_tools                 165   // 工具最大帧数

mat_vsync	                    0   // 垂直同步 <0.关闭 1.开启>     

//────────────────────     1.3HUD边缘位置    ────────────────────
safezonex                       1    // HUD水平占比
safezoney                       1    // HUD竖直占比                      
//═════════════════════════════════════════════════════════════════════════════


//══════════════════════    2. 音频设置    ════════════════════════════════════
//────────────────────     2.1音频    ────────────────────
volume                          1     // 主音量（对应实际百分比需要开方，0.01➡️√0.01=0.1=10%）
snd_menumap_volume              0.5   // 主菜单环境音量
snd_headphone_eq                0     // 均衡器 <0.自然 1.清脆 2.平滑>
snd_steamaudio_enable_perspective_correction 1 // 透视校正
snd_mute_losefocus              0     // 后台播放声音=0，后台静音=1

//────────────────────     2.2语音    ────────────────────
voice_modenable                 1     // 启用语音[不用改]
voice_always_sample_mic         1     // 简化按键通话 游戏中一直打开录音设备
snd_voipvolume                  0.8   // 其他玩家的语音音量

//────────────────────     2.3音乐    ────────────────────
snd_musicvolume                 0.5   // 主音乐音量（对应实际百分比需要开方，0.5➡️√0.5=0.707=70.7%≈71%）
snd_menumusic_volume            0.1   // 主菜单音量
snd_roundstart_volume           0.1   // 回合开始音量
snd_roundaction_volume          0.2   // 回合Action音量
snd_roundend_volume             0.1   // 回合结束音量
snd_mvp_volume                  0.1   // MVP音量
snd_mapobjective_volume         0.1   // 炸弹/人质音量
snd_tensecondwarning_volume     0.1   // 十秒警告音量
snd_deathcamera_volume          0.1   // 死亡视角音量
snd_mute_mvp_music_live_players 1     // 当双方团队成员都存活时关闭 MVP 音乐
//═════════════════════════════════════════════════════════════════════════════


//══════════════════════    3. 游戏设置   ════════════════════════════════════
//────────────────────     3.1游戏    ────────────────────
con_enable                    1     // 开启控制台[不用改]
mm_dedicated_search_maxping   80    // 最大匹配延迟ms
rate                          786432// 网络带宽4Mbps <不受限=786432 不超过2.5Mbps=327680 4Mbps=524288>
cl_net_buffer_ticks               0 // 缓冲以消除数据包抖动 <0.无 1=1tick 2=2ticks>

cl_cq_min_queue          0          // 数据包丢失缓冲 <-1.禁用队列 0.交给服务器决定 正数.指定最小队列长度>

//────────────────────     3.2HUD设置（显示雷达血条弹药等信息的UI）    ────────────────────
cl_color                         1  // 队伍中颜色        <0.蓝色 1.绿色 2.黄色 3.橙色 4.紫色>
cl_teamcounter_playercount_instead_of_avatars 0  // <1.用存活人数替代头像 0.显示队友头像>
ui_steam_overlay_notification_position "topright" // steam 提示出现位置 如"bottomleft"
cl_hud_color                     0  // 设置HUD颜色  <0.队伍颜色 1.白色 2.亮白色 3.淡蓝色 4.蓝色 5.紫色 6.红色 7.橙色 8.黄色 9.绿色 10.浅绿色 11.粉红色 12.玩家颜色>
cl_weapon_selection_rarity_color 0  // 按稀有度颜色显示武器发光效果
cl_force_spec_hud_color_to_team  0  // 观察时使用对应玩家的HUD颜色

//────────────────────     3.3团队    ────────────────────
cl_teamid_overhead_mode        3    // 隔墙显示队友位置          <0.不显示 1.显示△ 2.显示△+名称+血量 3.显示△+名称+血量+装备>
cl_teammate_colors_show        2    // 竞技模式队友颜色          <0.不显示 1.显示颜色 2.显示颜色+英文首字母>
cl_teamid_overhead_colors_show 1    // 玩家ID上使用玩家颜色


//────────────────────     3.4通讯    ────────────────────
cl_mute_enemy_team                0 // 将敌方静音
cl_mute_all_but_friends_and_party 0 // 除好友外一律静音
cl_allow_animated_avatars         1 // 是否允许使用动态头像
cl_sanitize_player_names          0 // 清理玩家名称，替换为中性名称

//────────────────────     3.5观察者和记分板    ────────────────────
cl_obs_interp_enable         0      //平滑观察者视角<0.关闭 1.开启 >
cl_obs_interp_speed          0      //平滑观察者视角速度<0.25~2.5 默认1>

//────────────────────     3.6物品（持枪参数+购买菜单捐赠快捷键）    ────────────────────
cl_silencer_mode               0    // 禁用卸下消音器
viewmodel_presetpos            3    // 持枪视角预设 <1.默认 2.写实 3.经典>
cl_prefer_lefthanded           0    // 偏好左手持枪 复活后刷新 <1.是 0.否>
cl_use_opens_buy_menu          0    // 关闭E键打开购买菜单
cl_buywheel_donate_key         0    // 购买菜单捐赠快捷键 <0.左Ctrl 1.左Alt 2.左Shift>

//自定义持枪视角参数
// viewmodel_fov                "62"
// viewmodel_offset_x           "2.5"
// viewmodel_offset_y           "2"
// viewmodel_offset_z           "-2"
// viewmodel_presetpos          "0"

//────────────────────     3.7雷达/平板    ────────────────────
cl_radar_always_centered        0    // 雷达以玩家为中心
cl_radar_rotate                 1    // 雷达旋转[不用改]
cl_hud_radar_map_additive       1    // 雷达地图与背景融合
cl_hud_radar_blur_background    0    // 模糊背景
cl_hud_radar_background_alpha   0.95 // 雷达背景透明度
cl_hud_radar_scale              1.2  // 雷达大小          <0.8-1.3>
cl_radar_scale                  0.5  // 雷达缩放          <默认0.7>
cl_radar_scale_alternate        1    // 雷达地图切换缩放 使用专用快捷键一键切换
cl_radar_square_with_scoreboard 1    // 切换计分板方形外观
cl_radar_square_always          0    // 强制方形外观
cl_radar_scale_dynamic          0    // 雷达动态缩放

cl_radar_icon_scale_min         0.5  // 雷达人物标点大小
hud_showtargetid                1    // 显示队友/敌人id
hud_scaling                     0.85 // HUD缩放          <0.5~0.95 默认0.85>

//────────────────────     3.8伤害预测    ────────────────────
cl_predict_body_shot_fx  0 // 关闭 预测击中身体的效果
cl_predict_head_shot_fx  0 // 关闭 预测爆头的效果
cl_predict_kill_ragdolls 0 // 关闭 预测击杀布娃娃效果

//────────────────────     3.9遥测    ────────────────────
//出现滑步、回溯等现象可以适当增加缓冲→1→2，缓解问题
cl_hud_telemetry_frametime_show       2        // 显示帧生成时间及FPS <0.从不 1. 如果条件恶劣 2.总是>
cl_hud_telemetry_frametime_poor       6.06     // 帧生成时间警告阈值=100ms 注意用1000/fps 如检测低于144fps的异常 1000/144=6.94 1000/165=6.06
cl_hud_telemetry_ping_show            1        // 显示延迟 <0.从不 1. 如果条件恶劣 2.总是>
cl_hud_telemetry_net_misdelivery_show 1        // 显示丢包/发送错误率LOSS <0.从不 1. 如果条件恶劣 2.总是>
cl_hud_telemetry_net_misdelivery_poor 5        // 数据包发送故障警告阈值=5个
cl_hud_telemetry_serverrecvmargin_graph_show 0 // 显示网络/帧时间数据图表 <0. 不显示 1. 如果条件恶劣 2. 总是>

cl_hud_telemetry_ping_poor            50       // 延迟警告阈值=100ms
//═════════════════════════════════════════════════════════════════════════════


//══════════════════════    4. 键盘/鼠标    ════════════════════════════════════
//────────────────────     4.1键盘和鼠标设置    ────────────────────
sensitivity                  1.175 // 鼠标灵敏度  P.S. DPI x 灵敏度 = eDPI
zoom_sensitivity_ratio       1.2   // 开镜时灵敏度
m_yaw                        0.02  // 默认x轴速度 <可用于拉伸补偿 16:10->0.020 4:3->0.0165 5:4->0.016 16:9->0.022>

//────────────────────     键位绑定    ────────────────────
binddefaults;                      // 重置所有按键，以防键位冲突，bind指令必须放在之后↓
bind  `      "toggleconsole";      // ` 显示控制台
bind  mouse3 "player_ping";        // 鼠标中键 标记位置（恢复原版）
bind  mouse5 "+voicerecord";       // 前侧键使用麦克风
bind  alt    "noclip";             // alt飞行
bind  ins    "exec auto.cfg";      // Insert 加载auto.cfg
bind  del    "exec practice.cfg";  // Delete 加载practice.cfg<跑图cfg>
bind  h      "switchhands";        // H 切换左右手持枪
bind  j      "clutch_mode_toggle"; // J 残局模式（屏蔽队友语音/无线电，回合结束或死亡后自动关闭）
bind  y      "say";                // Y 全部打字（全服聊天）
bind  p      "say_team .drop"      // P 一键发刀
bind  backspace "sellbackall";     // 后退键 退回所有已购买物品
bind  mouse4 "slot12; radio2";     // 后侧键：医疗针 + 标准类无线电
bind  v      "toggleradarscale";   // V 切换雷达缩放 2个比例请在 <3.7雷达/平板> 中修改
bind "\" "rebuy"                   //按\重买

bind "]" "say ╭∩╮( ° ͜ʖ͡°)╭∩╮"       //聊天框表情       
bind "[" "say  (╭☞ ͡° ͜ʖ ͡° )╭☞"

alias mute   "toggle volume 0.1 1";                  // 定义mute切换静音(未绑定按键)
bind  F8     "mute"

// bind  r      "+reload;say_team Cover!Reloading!;" // 换子弹提醒队友（删//开启 如果不怕被T）

alias auto   "exec auto"           // 指令 auto 载入游戏cfg
alias pt     "exec practice"       // 指令 pt 载入跑图cfg
alias solo   "exec solo"           // 指令 solo 载入单挑cfg
alias demo   "exec demo"           // 指令 demo 载入录像cfg

//固定滚轮跳
bind  mwheelup +jump;  bind mwheeldown +jump;

//快速切换道具
bind z "slot8"        // 烟
bind x "slot10"       // 火
bind c "slot3; slot7" // 闪（快速双闪）
// bind c "slot6"        // 雷
// bind v "slot12"       // 医疗针——已并入鼠标后侧键的绑定，这行保留作参考


